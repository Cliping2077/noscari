name: offline-core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev,torch]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/scan_secrets.py .
      - run: python scripts/audit_release.py . --output work/ci-audit.json
      - run: python -m build --no-isolation
      - run: python -I scripts/installed_smoke.py --install-wheel dist --output work/installed-smoke
  core-without-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - run: python -I scripts/installed_smoke.py --install-wheel dist --output work/core-smoke --without-torch
